<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d32">
  <meta name="description" content="과학 서술형 평가부터 교사 피드백, 학생 보충학습까지 이어지는 학습 서비스 데모입니다.">
  <title>이어봄 · 과학 평가와 다음 학습</title>
  <link rel="stylesheet" href="/styles_ver1.css">
  <script src="/app_ver1.js" defer></script>
</head>
<body>

    <symbol id="i-clock" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></symbol>

    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.2 2-2 2-2.1-1.2a7.4 7.4 0 0 1-1.6.7l-.6 2.4h-2.8l-.6-2.4a7.4 7.4 0 0 1-1.6-.7L7.3 19l-2-2 1.2-2.1a7.4 7.4 0 0 1-.7-1.6l-2.4-.6V10l2.4-.6a7.4 7.4 0 0 1 .7-1.6L5.3 5.7l2-2 2.1 1.2a7.4 7.4 0 0 1 1.6-.7l.6-2.4h2.8l.6 2.4a7.4 7.4 0 0 1 1.6.7l2.1-1.2 2 2-1.2 2.1a7.4 7.4 0 0 1 .7 1.6l2.4.6v2.8l-2.4.6a7.4 7.4 0 0 1-.7 1.6Z"/></symbol>

    <symbol id="i-trend" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 8-9"/><path d="M15 6h6v6"/></symbol>
  </svg>

  <div class="app-shell" id="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="주 메뉴">
      <a class="brand" href="#top" aria-label="이어봄 홈">
        <span class="brand-symbol"><svg aria-hidden="true"><use href="#i-mark"></use></svg></span>
        <span class="brand-word">이어봄<span>SCIENCE / LEARNING</span></span>
      </a>
      <div class="workspace-switch">
        <span class="workspace-icon"><svg aria-hidden="true"><use href="#i-flask"></use></svg></span>
        <span><small>워크스페이스</small><strong id="workspace-name">2학년 3반</strong></span>
        <svg class="workspace-chevron" aria-hidden="true"><use href="#i-chevron"></use></svg>
      </div>
      <div class="sidebar-label" id="nav-label">교사 작업</div>
      <nav class="side-nav" id="side-nav" aria-label="화면 이동"></nav>
      <div class="sidebar-spacer"></div>
      <div class="sidebar-sync" id="sidebar-sync"></div>
      <div class="profile-mini" id="profile-mini"></div>
    </aside>

    <div class="main-frame" id="top">
      <header class="topbar">
        <div class="topbar-left">
          <button class="mobile-menu icon-button" type="button" data-action="toggle-sidebar" aria-label="메뉴 열기"><svg aria-hidden="true"><use href="#i-grid"></use></svg></button>
          <div class="breadcrumbs"><span id="crumb-parent">과학 수업</span><svg aria-hidden="true"><use href="#i-chevron"></use></svg><strong id="crumb-current">오늘의 현황</strong></div>
        </div>
        <div class="topbar-right">
          <span class="demo-chip"><i></i>시연 데이터</span>
          <div class="role-switch" role="group" aria-label="체험할 사용자 역할">
            <button type="button" data-role="teacher" aria-pressed="true">교사</button>
            <button type="button" data-role="student" aria-pressed="false">학생</button>
            <button type="button" data-role="admin" aria-pressed="false">관리자</button>
          </div>
          <button class="icon-button notification-button" type="button" data-action="notifications" aria-label="알림"><svg aria-hidden="true"><use href="#i-bell"></use></svg><i></i></button>
          <span class="top-avatar" id="top-avatar" aria-label="현재 사용자">이지</span>
        </div>
      </header>

      <div class="demo-notice" role="note">
        <span class="notice-icon"><svg aria-hidden="true"><use href="#i-info"></use></svg></span>
        <p><strong>인터랙티브 데모</strong><span>표시된 이름·답안·점수는 모두 예시입니다. 현재 Supabase와 Upstage API는 연결되지 않으며, 실제 로그인·저장·AI 채점이 발생하지 않습니다.</span></p>
        <button type="button" class="notice-close" data-action="dismiss-notice" aria-label="안내 접기"><svg aria-hidden="true"><use href="#i-close"></use></svg></button>
      </div>

      <main class="main-content" id="main-content" tabindex="-1"></main>
      <div class="toast-stack" id="toast-stack" aria-live="polite" aria-atomic="false"></div>
    </div>
  </div>

  <dialog class="app-dialog" id="app-dialog" aria-labelledby="dialog-title">
    <div class="dialog-content" id="dialog-content"></div>
  </dialog>
</body>
</html>
