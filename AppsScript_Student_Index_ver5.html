<!doctype html>
<html lang="ko">
<head>
  <base target="_top">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    :root{font-family:Arial,"Noto Sans KR",sans-serif;color:#1c2923;background:#f2f3ed}*{box-sizing:border-box}body{margin:0;padding:24px;min-height:100vh;display:grid;place-items:center}.card{width:min(470px,100%);border:1px solid #dfe6dc;border-radius:20px;background:#fffefa;padding:26px;box-shadow:0 14px 38px rgba(28,46,35,.09)}.brand{display:flex;align-items:center;gap:10px;color:#173d32;font-weight:750}.mark{display:grid;width:38px;height:38px;place-items:center;border-radius:12px;background:#173d32;color:#c9e98c;font-size:18px}.eyebrow{margin-top:21px;color:#527653;font-size:11px;font-weight:700;letter-spacing:.1em}.title{margin:7px 0 5px;font-size:26px;letter-spacing:-.04em}.intro{margin:0 0 19px;color:#758178;font-size:13px;line-height:1.65}.field{display:grid;gap:6px;margin:12px 0}.field label{font-size:12px;font-weight:700;color:#506055}.field input{width:100%;height:44px;border:1px solid #dfe5dc;border-radius:10px;background:white;padding:0 12px;font-size:14px}.row{display:grid;grid-template-columns:.62fr 1.38fr;gap:10px}.pin{letter-spacing:.25em}.submit{width:100%;height:46px;margin-top:8px;border:0;border-radius:11px;background:#173d32;color:white;font-weight:700;cursor:pointer}.submit:disabled{opacity:.55;cursor:wait}.message{min-height:22px;margin:9px 0 0;color:#667468;font-size:12px;line-height:1.5}.message.error{color:#a6463d}.privacy{margin-top:16px;padding:12px;border-radius:11px;background:#f3f5ee;color:#657166;font-size:11px;line-height:1.6}.privacy strong{color:#394b3b}.portal{text-align:center}.portal .mark{margin:auto}.logout{margin-top:18px;padding:11px 15px;border:1px solid #dfe5dc;border-radius:10px;background:white;color:#36543d;font-weight:700;cursor:pointer}.footer{margin-top:16px;color:#90998f;font-size:10px;text-align:center}@media(max-width:420px){body{padding:14px}.card{padding:20px}.title{font-size:23px}}
  </style>
</head>
<body>
  <main class="card" id="app">
    <div class="brand"><span class="mark" aria-hidden="true">↗</span><span>이어봄 · 과학 학습</span></div>
    <p class="eyebrow">학생용 접속 · Google 계정 불필요</p>
    <h1 class="title">학급 정보를 입력해요</h1>
    <p class="intro">학급 코드, 반, 번호와 이름으로 명단을 확인합니다. PIN은 학생 본인을 확인하는 데 사용해요.</p>
    <form id="login-form">
      <div class="field"><label for="class-code">학급 코드</label><input id="class-code" name="classCode" autocomplete="off" required></div>
      <div class="field"><label for="class-name">반</label><input id="class-name" name="className" autocomplete="off" required></div>
      <div class="row"><div class="field"><label for="attendance">번호</label><input id="attendance" name="attendanceNumber" inputmode="numeric" autocomplete="off" required></div><div class="field"><label for="student-name">이름</label><input id="student-name" name="name" autocomplete="name" required></div></div>
      <div class="field"><label for="pin">나의 PIN 4자리</label><input class="pin" id="pin" name="pin" type="password" inputmode="numeric" pattern="[0-9]{4}" maxlength="4" autocomplete="off" required></div>
      <button class="submit" id="submit" type="submit">안내 확인 후 접속</button>
      <p class="message" id="message" role="status" aria-live="polite"></p>
    </form>
    <div class="privacy"><strong>안내:</strong> 학생 이름·번호는 명단 확인에 사용하고, PIN 원문은 시트에 저장하지 않습니다. 평가 답안은 담당 교사에게 표시됩니다.</div>
    <p class="footer">공용 기기에서는 사용 후 로그아웃해 주세요. 일정 시간 사용하지 않으면 접속이 만료됩니다.</p>
  </main>
  <script>
    let sessionToken = "";
    const form = document.getElementById("login-form");
    const button = document.getElementById("submit");
    const message = document.getElementById("message");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      button.disabled = true;
      button.textContent = "명단을 확인하고 있어요...";
      message.className = "message";
      message.textContent = "학생 정보를 안전하게 확인하고 있습니다.";
      const payload = Object.fromEntries(new FormData(form).entries());
      google.script.run
        .withSuccessHandler((result) => {
          button.disabled = false;
          button.textContent = "안내 확인 후 접속";
          if (!result?.ok) {
            message.className = "message error";
            message.textContent = result?.message || "접속할 수 없습니다. 입력 내용을 확인해 주세요.";
            return;
          }
          sessionToken = result.token;
          renderStudentHome(result.student);
        })
        .withFailureHandler(() => {
          button.disabled = false;
          button.textContent = "안내 확인 후 접속";
          message.className = "message error";
          message.textContent = "접속 중 문제가 생겼습니다. 잠시 후 다시 시도해 주세요.";
        })
        .studentLogin(payload);
    });

    function renderStudentHome(student) {
      document.getElementById("app").innerHTML = `<div class="portal"><div class="brand" style="justify-content:center"><span class="mark" aria-hidden="true">✓</span></div><p class="eyebrow">학생 본인 확인 완료</p><h1 class="title">${escapeHtml(student.displayName)} 학생</h1><p class="intro">${escapeHtml(student.className)} · ${escapeHtml(student.attendanceNumber)}번<br>로그인 연결을 확인했습니다. 평가 화면은 다음 Apps Script 단계에서 연결합니다.</p><button class="logout" id="logout" type="button">로그아웃</button><p class="footer">이 창을 닫으면 다시 로그인해야 합니다.</p></div>`;
      document.getElementById("logout").addEventListener("click", () => {
        google.script.run.withSuccessHandler(() => { sessionToken = ""; location.reload(); }).studentLogout(sessionToken);
      });
    }

    function escapeHtml(value) {
      return String(value ?? "").replace(/[&<>"']/g, (char) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[char]);
    }
  </script>
</body>
</html>
